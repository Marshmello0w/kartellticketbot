buttons:
  ai_human:
    text: Request a supporter
  accept_close_request:
    text: Aksepter
  cancel:
    text: Avbryt
  claim:
    text: Ta over
  close:
    text: Lukk
  confirm_open:
    text: Lag ticket
  edit:
    text: Endre
  reject_close_request:
    text: Avslå
  unclaim:
    text: Avbyt overtak
  create:
    text: Lag en ticket
commands:
  message:
    create:
      name: Opprett ticket fra melding
    pin:
      name: Fest melding
      not_pinnable:
        description: "Denne meldingen kan ikke festes.\nVennligst be en administrator
          om å sjekke botens tillatelser.\n"
      not_ticket:
        description: Du kan bare feste meldinger i tickets.
        title: ❌ Dette er ikke en ticket kanal
      pinned:
        description: Meldingen er festet.
        title: ✅ Festet melding
  slash:
    faq-analyze:
      description: Analyze a ticket chat and create FAQ suggestions for the portal
      options:
        ticket:
          description: Ticket number or channel ID; defaults to the current ticket
      started: The chat is being analyzed. FAQ suggestions appear in the portal under FAQ.
      done: "Analyzed {messages} text messages: {count} new FAQ suggestions. Review
        and publish them in the portal under FAQ."
      failed: The analysis could not be completed. Check the FAQ page in the portal
        for the status, Gemini connection and quota.
      truncated: The chat was long or only partially accessible. Only an excerpt was analyzed.
      denied: Only category support staff and administrators can analyze tickets for
        the FAQ.
      ticket_missing: Run this command in a ticket or provide a valid ticket number.

    add:
      options:
        ticket:
          description: Ticket å legge medlemmet til
          name: ticket
        member:
          description: Medlemmet å legge til ticketen
          name: medlem
      success:
        description: '{member} er lagt til {ticket}.'
        title: ✅ Addet
      added: ➡️ {added} er lagt til av {by}.
      description: Legg til et medlem på en ticket
      not_staff:
        description: Bare staff kan legge til medlemmer til andres tickets.
    claim:
      description: Overta en ticket
      name: overta
      not_staff:
        description: Kun staff kan overta tickets.

        description: คุณสามารถปักหมุดข้อความได้เฉพาะในห้องติดต่อ
      pinned:
        title: ✅ ข้อความถูกปักหมุดแล้ว
        description: ข้อความได้ถูกปักหมุดแล้ว
      name: ปักหมุดข้อความ
    create:
      name: สร้างห้องติดต่อจากข้อความ
